<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff8fa3">
<title>=LOVE 21作コンプリートクイズ</title>
<style>
  :root {
    --bg: #fdf2f4;
    --text: #333;
    --card: #ffffff;
    --pink: #ff8fa3;
    --pink-dark: #ff4d6d;
    --border: #ff8fa3;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #241318;
      --text: #f3e3e8;
      --card: #341c24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #241318;
    --text: #f3e3e8;
    --card: #341c24;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    text-align: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100%;
  }
  h1 { font-size: 20px; line-height: 1.4; }
  .btn {
    background: var(--pink); color: white; border: none;
    padding: 12px 24px; font-size: 16px; border-radius: 20px;
    cursor: pointer; margin: 10px;
  }
  .btn:active { background: var(--pink-dark); }
  .choice-container { display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
  .choice-btn {
    width: 100%; max-width: 350px; background: var(--card); color: var(--text);
    border: 2px solid var(--border); padding: 12px; margin: 5px;
    border-radius: 10px; font-size: 16px; cursor: pointer;
  }
  .choice-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #result { font-weight: bold; font-size: 18px; margin-top: 20px; line-height: 1.6; }
  #question-text { font-size: 22px; }
  .rank-text { font-size: 24px; margin: 16px 0; font-weight: bold; color: var(--pink-dark); }

  /* プレイヤーは画面外に小さく配置し、音声だけ流す（0サイズだとAPI側が不安定になるため2pxを確保） */
  #player-wrap {
    position: absolute; width: 2px; height: 2px; opacity: 0.01;
    bottom: 0; left: 0; overflow: hidden; pointer-events: none;
  }
  .replay-btn {
    background: #4a90d9; color: white; border: none; padding: 10px 18px;
    font-size: 15px; border-radius: 18px; cursor: pointer; margin-top: 8px;
  }

  /* ホーム画面 */
  #home-screen { padding-top: 8px; }
  .home-heart {
    width: 130px; height: auto; display: block; margin: 0 auto 10px;
    filter: drop-shadow(0 8px 16px rgba(255, 77, 109, 0.35));
  }
  .home-sub { color: var(--pink-dark); font-size: 14px; margin: 2px 0 22px; }
  #loading-msg { font-size: 14px; opacity: 0.7; }
  #mode-select { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 8px; }
  .mode-card {
    width: 100%; max-width: 320px; background: var(--card); color: var(--text);
    border: 2px solid var(--pink); border-radius: 16px; padding: 14px 18px;
    cursor: pointer; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08); font: inherit; text-align: left;
  }
  .mode-card.coupling { border-color: #4a90d9; }
  .mode-icon { font-size: 28px; flex-shrink: 0; }
  .mode-text { display: flex; flex-direction: column; }
  .mode-label { font-size: 16px; font-weight: bold; }
  .mode-desc { font-size: 12px; opacity: 0.65; margin-top: 2px; }

  #home-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: 12px;
    z-index: 20;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--card);
    color: var(--pink-dark);
    font-size: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .home-topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .home-logo {
    display: flex; align-items: center; gap: 4px;
    font-weight: bold; font-size: 13px; color: var(--pink-dark);
    background: var(--card); border: 1px solid var(--pink);
    border-radius: 14px; padding: 4px 10px;
  }
  .yt-link-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: #ff0000; color: #fff; text-decoration: none;
    font-size: 12px; font-weight: bold;
    border-radius: 14px; padding: 6px 10px;
  }
  .mode-card.timeattack { border-color: #ffb020; }
  #singles-submenu { display: none; flex-direction: column; align-items: center; gap: 12px; margin-top: 8px; }
</style>
</head>

      { title: "君の第3ボタン", videoId: "xmo-UbsUZE4", chorusStart: 55, parentNumber: 16, parentTitle: "呪って呪って" },
      { title: "誰にもバレずに", videoId: "E4PVynHrfp8", chorusStart: 55, parentNumber: 16, parentTitle: "呪って呪って" },
      { title: "仲直りシュークリーム", videoId: "D0SfIi-0Zpo", chorusStart: 55, parentNumber: 17, parentTitle: "絶対アイドル辞めないで" },
      { title: "海とレモンティー", videoId: "i024yWd9oiI", chorusStart: 55, parentNumber: 17, parentTitle: "絶対アイドル辞めないで" },
      { title: "超特急逃走中", videoId: "d20dEAtbL08", chorusStart: 55, parentNumber: 18, parentTitle: "とくべチュ、して" },
      { title: "恋人以上、好き未満", videoId: "p-jc9qMpBb4", chorusStart: 55, parentNumber: 18, parentTitle: "とくべチュ、して" },
      { title: "Queens", videoId: "Pyts1pc0u1A", chorusStart: 55, parentNumber: 19, parentTitle: "ラブソングに襲われる" },
      { title: "木漏れ日メゾフォルテ", videoId: "4xBmuiQNGdc", chorusStart: 55, parentNumber: 19, parentTitle: "ラブソングに襲われる" },
      { title: "お姫様の作り方", videoId: "2udLA8-QuD8", chorusStart: 55, parentNumber: 20, parentTitle: "劇薬中毒" },
      { title: "モラトリアム", videoId: "ZROuG57QGls", chorusStart: 55, parentNumber: 20, parentTitle: "劇薬中毒" },
      { title: "夏名残サマーチューン", videoId: "_Bm66BRnM1A", chorusStart: 55, parentNumber: 21, parentTitle: "恋、はじめました。" },
      { title: "夢の続き", videoId: "RjHjQlEjs_E", chorusStart: 55, parentNumber: 21, parentTitle: "恋、はじめました。" }
    ];
    const QUESTION_COUNT_SINGLES = 8;
    const QUESTION_COUNT_COUPLING = 8;
    const QUIZ_BOX_TEMPLATE = `
      <h2 id="question-number"></h2>
      <p id="question-text"></p>
      <div class="choice-container" id="choices"></div>
      <div id="result"></div>
      <button class="btn" id="next-btn" onclick="nextQuestion()" style="display: none; background: #4caf50;">次の問題へ ➔</button>
    `;

    let currentMode = 'singles';
    let currentPool = allSingles;
    let questionCount = QUESTION_COUNT_SINGLES;
    let currentQuestions = [];
    let currentIdx = 0;
    let correctCount = 0;
    var player;
    let stopTimer;

    // タイムアタック用の状態
    let taTimer = null;
    let taSecondsLeft = 0;
    let taAnswered = 0;
    let taCorrect = 0;
    let taActive = false;
    let taCurrentQuiz = null;

    // YouTube IFrame Player APIを正しいURLで読み込む
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '2',
        width: '2',
        videoId: allSingles[0].videoId,
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1 },
        events: { 'onReady': onPlayerReady }
      });
    }

    function onPlayerReady() {
      document.getElementById('loading-msg').style.display = "none";
      document.getElementById('mode-select').style.display = "flex";
    }

    function resetQuizBoxDOM() {
      document.getElementById('quiz-box').innerHTML = QUIZ_BOX_TEMPLATE;
    }

    function showSinglesSubmenu() {
      document.getElementById('mode-select').style.display = "none";
      document.getElementById('singles-submenu').style.display = "flex";
    }

    function backToModeSelect() {
      document.getElementById('singles-submenu').style.display = "none";
      document.getElementById('mode-select').style.display = "flex";
    }

    function initGame(mode) {
      currentMode = mode;
      currentPool = mode === 'coupling' ? couplingSongs : allSingles;
      questionCount = Math.min(mode === 'coupling' ? QUESTION_COUNT_COUPLING : QUESTION_COUNT_SINGLES, currentPool.length);

      resetQuizBoxDOM();
      document.getElementById('home-screen').style.display = "none";
      document.getElementById('quiz-box').style.display = "block";
      document.getElementById('home-btn').style.display = "flex";
      correctCount = 0;
      const shuffled = [...currentPool].sort(() => 0.5 - Math.random());
      currentQuestions = shuffled.slice(0, questionCount);
      currentIdx = 0;
      loadQuestion();
    }

    function goHome() {
      clearTimeout(stopTimer);
      clearInterval(taTimer);
      taActive = false;
      if (player && typeof player.stopVideo === 'function') {
        try { player.stopVideo(); } catch (e) {}
      }
      document.getElementById('quiz-box').style.display = "none";
      document.getElementById('home-btn').style.display = "none";
      document.getElementById('singles-submenu').style.display = "none";
      document.getElementById('mode-select').style.display = "flex";
      document.getElementById('home-screen').style.display = "block";
    }

    // ===== タイムアタックモード（10秒で何問答えられるか。曲は再生しない） =====
    function startTimeAttack() {
      currentMode = 'singles-timeattack';
      resetQuizBoxDOM();
      document.getElementById('home-screen').style.display = "none";
      document.getElementById('quiz-box').style.display = "block";
      document.getElementById('home-btn').style.display = "flex";
      document.getElementById('next-btn').style.display = "none";

      taSecondsLeft = 10;
      taAnswered = 0;
      taCorrect = 0;
      taActive = true;
      clearInterval(taTimer);
      taTimer = setInterval(() => {
        taSecondsLeft--;
        if (taSecondsLeft <= 0) {
          endTimeAttack();
        } else {
          updateTaHeader();
        }
      }, 1000);
      loadTimeAttackQuestion();
    }

    function updateTaHeader() {
      const el = document.getElementById('question-number');
      if (el) el.innerText = `⏱️ 残り ${taSecondsLeft} 秒`;
    }

    function loadTimeAttackQuestion() {
      taCurrentQuiz = allSingles[Math.floor(Math.random() * allSingles.length)];
      updateTaHeader();
      document.getElementById('question-text').innerHTML = `<span style="color:var(--pink-dark); font-weight:bold;">${taCurrentQuiz.number}th シングル</span> は何でしょう？`;
      document.getElementById('result').innerText = "";

      let choiceTitles = [taCurrentQuiz.title];
      while (choiceTitles.length < 4) {
        const r = allSingles[Math.floor(Math.random() * allSingles.length)];
        if (!choiceTitles.includes(r.title)) choiceTitles.push(r.title);
      }
      choiceTitles.sort(() => 0.5 - Math.random());

      const choicesDiv = document.getElementById('choices');
      choicesDiv.innerHTML = "";
      choiceTitles.forEach(title => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = `『 ${title} 』`;
        btn.onclick = () => checkTimeAttackAnswer(title);
        choicesDiv.appendChild(btn);
      });
    }

    function checkTimeAttackAnswer(selectedTitle) {
      if (!taActive) return;
      taAnswered++;
      if (selectedTitle === taCurrentQuiz.title) taCorrect++;
      loadTimeAttackQuestion(); // 曲は流さず、すぐ次の問題へ
    }

    function endTimeAttack() {
      taActive = false;
      clearInterval(taTimer);
      document.getElementById('quiz-box').innerHTML = `
        <h2>⏱️ タイムアップ！</h2>
        <p style="font-size: 20px;">10秒で <strong>${taAnswered}問中 ${taCorrect}問正解</strong>！</p>
        <button class='btn' onclick='location.reload()'>もう一度遊ぶ</button>
      `;
    }
    // ===== タイムアタックここまで =====

    function loadQuestion() {
      clearTimeout(stopTimer);

      const currentQuiz = currentQuestions[currentIdx];

      document.getElementById('question-number').innerText = `第 ${currentIdx + 1} 問 / 全${questionCount}問`;
      document.getElementById('question-text').innerHTML = currentMode === 'coupling'
        ? `<span style="color:var(--pink-dark); font-weight:bold;">${currentQuiz.parentNumber}th シングル『${currentQuiz.parentTitle}』</span>のカップリング曲は？`
        : `<span style="color:var(--pink-dark); font-weight:bold;">${currentQuiz.number}th シングル</span> は何でしょう？`;

      document.getElementById('result').innerText = "";
      document.getElementById('next-btn').style.display = "none";

      // 選択肢を先に確定させる（カップリングは同じシングル内の曲を除外し、正解が2つになるのを防ぐ）
      let choiceTitles = [currentQuiz.title];
      let attempts = 0;
      while (choiceTitles.length < 4 && choiceTitles.length < currentPool.length && attempts < 500) {
        attempts++;
        const randomSong = currentPool[Math.floor(Math.random() * currentPool.length)];
        const sameParent = currentMode === 'coupling' && randomSong.parentNumber === currentQuiz.parentNumber;
        if (!choiceTitles.includes(randomSong.title) && !sameParent) {
          choiceTitles.push(randomSong.title);
        }
      }
      choiceTitles.sort(() => 0.5 - Math.random());

      const choicesDiv = document.getElementById('choices');
      choicesDiv.innerHTML = "";
      choiceTitles.forEach(title => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = `『 ${title} 』`;
        btn.onclick = () => checkAnswer(title);
        choicesDiv.appendChild(btn);
      });

      // 動画の先読みは選択肢を出したあとに行う（失敗しても選択肢表示には影響しない）
      try {
        if (player && typeof player.pauseVideo === 'function') { player.pauseVideo(); }
        if (player && typeof player.cueVideoById === 'function') {
          player.cueVideoById({ videoId: currentQuiz.videoId, startSeconds: currentQuiz.chorusStart });
        }
      } catch (e) { /* 動画の準備に失敗しても問題の表示は継続する */ }
    }

    function checkAnswer(selectedTitle) {
      const buttons = document.querySelectorAll('.choice-btn');
      buttons.forEach(b => b.disabled = true);

      const currentQuiz = currentQuestions[currentIdx];
      const resultDiv = document.getElementById('result');

      if (selectedTitle === currentQuiz.title) {
        resultDiv.innerHTML = `<span style='color: #2e9e3f; font-size: 24px;'>⭕ 正解！</span><br>`;
        correctCount++;
      } else {
        resultDiv.innerHTML = `<span style='color: #e0433a; font-size: 24px;'>❌ 不正解！</span><br>正解は <strong>『 ${currentQuiz.title} 』</strong> です！<br>`;
      }

      resultDiv.innerHTML += currentMode === 'coupling'
        ? `💿 ${currentQuiz.parentNumber}th シングル『${currentQuiz.parentTitle}』収録<br>`
        : `📅 発売日：${currentQuiz.releaseDate}<br>`;
      resultDiv.innerHTML += `🎵 サビを5秒間流すよ！`;
      resultDiv.innerHTML += `<br><button class="replay-btn" onclick="playChorus()">🔊 サビを聴く</button>`;

      // ボタンクリックの中で直接呼ぶことで、ブラウザの自動再生ブロックを回避する
      playChorus();

      document.getElementById('next-btn').style.display = "inline-block";
    }

    function playChorus() {
      const currentQuiz = currentQuestions[currentIdx];
      if (!player || typeof player.playVideo !== 'function') return;
      clearTimeout(stopTimer);
      try {
        player.seekTo(currentQuiz.chorusStart, true);
        player.unMute();
        player.playVideo();
      } catch (e) { /* 再生に失敗しても他のUIには影響させない */ }
      stopTimer = setTimeout(() => {
        if (player && typeof player.pauseVideo === 'function') {
          try { player.pauseVideo(); } catch (e) {}
        }
      }, 5000);
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < currentQuestions.length) {
        loadQuestion();
      } else {
        clearTimeout(stopTimer);
        if (player && typeof player.stopVideo === 'function') { player.stopVideo(); }
        let rankName = "";
        let rankComment = "";
        const goodLine = Math.ceil(questionCount * 0.6);

        if (correctCount === questionCount) {
          rankName = "👑 伝説のイコラブマスター";
          rankComment = "全問正解！非の打ち所がない完璧なオタクです。指原Pもびっくり！";
        } else if (correctCount >= goodLine) {
          rankName = "💖 一人前のイコラブファン";
          rankComment = "素晴らしい知識量です！あと一歩でカンペキ！";
        } else if (correctCount >= 1) {
          rankName = "🌱 イコラブ見習い";
          rankComment = "ここからもっとMVを擦り切れるまで見ましょう！";
        } else {
          rankName = "😱 悔い改めよオタク";
          rankComment = "全問不正解…！後悔しましたか？今すぐもう一度挑戦です！";
        }

        document.getElementById('quiz-box').innerHTML = `
          <h2>🎉 クイズ終了！</h2>
          <p style="font-size: 20px;">あなたの結果は <strong>${questionCount}問中 ${correctCount} 問正解</strong> でした！</p>
          <div class="rank-text">${rankName}</div>
          <p style="padding: 0 20px;">${rankComment}</p>
          <button class='btn' onclick='location.reload()'>もう一度遊ぶ</button>
        `;
      }
    }
  </script>
