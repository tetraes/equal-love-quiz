<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff8fa3">
<title>=LOVE 21作コンプリートクイズ</title>
<style>
  :root {
    --bg: #fdf2f4;
    --text: #333;
    --card: #ffffff;
    --pink: #ff8fa3;
    --pink-dark: #ff4d6d;
    --border: #ff8fa3;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #241318;
      --text: #f3e3e8;
      --card: #341c24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #241318;
    --text: #f3e3e8;
    --card: #341c24;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    text-align: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    min-height: 100%;
  }
  h1 { font-size: 20px; line-height: 1.4; }
  .btn {
    background: var(--pink); color: white; border: none;
    padding: 12px 24px; font-size: 16px; border-radius: 20px;
    cursor: pointer; margin: 10px;
  }
  .btn:active { background: var(--pink-dark); }
  .choice-container { display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
  .choice-btn {
    width: 100%; max-width: 350px; background: var(--card); color: var(--text);
    border: 2px solid var(--border); padding: 12px; margin: 5px;
    border-radius: 10px; font-size: 16px; cursor: pointer;
  }
  .choice-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #result { font-weight: bold; font-size: 18px; margin-top: 20px; line-height: 1.6; }
  #question-text { font-size: 22px; }
  .rank-text { font-size: 24px; margin: 16px 0; font-weight: bold; color: var(--pink-dark); }

  /* プレイヤーは画面外に小さく配置し、音声だけ流す（0サイズだとAPI側が不安定になるため2pxを確保） */
  #player-wrap {
    position: absolute; width: 2px; height: 2px; opacity: 0.01;
    bottom: 0; left: 0; overflow: hidden; pointer-events: none;
  }
  .replay-btn {
    background: #4a90d9; color: white; border: none; padding: 10px 18px;
    font-size: 15px; border-radius: 18px; cursor: pointer; margin-top: 8px;
  }
</style>
</head>
<body>

  <h1>=LOVE 21作コンプリート・何番目シングル当てゲーム</h1>
  <div id="quiz-box">
    <h2 id="question-number">システム準備中...</h2>
    <p id="question-text">YouTubeの準備をしています。少々お待ちください。</p>

    <div id="player-wrap"><div id="player"></div></div>

    <button class="btn" id="start-btn" onclick="initGame()" disabled style="background:#ccc; cursor:not-allowed;">準備中...</button>

    <div class="choice-container" id="choices"></div>
    <div id="result"></div>

    <button class="btn" id="next-btn" onclick="nextQuestion()" style="display: none; background: #4caf50;">次の問題へ ➔</button>
  </div>

  <script>
    const allSingles = [
      { number: 1, title: "＝LOVE", videoId: "xOAaBsPaPpY", chorusStart: 62, releaseDate: "2017年9月6日" },
      { number: 2, title: "僕らの制服クリスマス", videoId: "YIjPbF-dKQA", chorusStart: 51, releaseDate: "2017年12月6日" },
      { number: 3, title: "手遅れcaution", videoId: "w0N0TiOlAY0", chorusStart: 68, releaseDate: "2018年5月16日" },
      { number: 4, title: "Want you! Want you!", videoId: "Bot92Nn-ozk", chorusStart: 49, releaseDate: "2018年10月17日" },
      { number: 5, title: "探せ ダイヤモンドリリー", videoId: "t5r0rNwjXQU", chorusStart: 59, releaseDate: "2019年4月24日" },
      { number: 6, title: "ズルいよ ズルいね", videoId: "J5eTB_0SEeg", chorusStart: 62, releaseDate: "2019年10月30日" },
      { number: 7, title: "CAMEO", videoId: "iEYwHScdJFQ", chorusStart: 68, releaseDate: "2020年7月8日" },
      { number: 8, title: "青春“サブリミナル”", videoId: "8id6i_QeNJM", chorusStart: 66, releaseDate: "2020年11月25日" },
      { number: 9, title: "ウィークエンドシトロン", videoId: "skgh3juWdFU", chorusStart: 58, releaseDate: "2021年8月25日" },
      { number: 10, title: "The 5th", videoId: "Q1-yYjZqk7o", chorusStart: 69, releaseDate: "2021年12月15日" },
      { number: 11, title: "あの子コンプレックス", videoId: "ShbfYtAPXuI", chorusStart: 66, releaseDate: "2022年5月25日" },
      { number: 12, title: "Be Selfish", videoId: "suf7S4AKdmY", chorusStart: 52, releaseDate: "2022年9月28日" },
      { number: 13, title: "この空がトリガー", videoId: "20QJax8CwQo", chorusStart: 68, releaseDate: "2023年2月22日" },
      { number: 14, title: "ナツマトペ", videoId: "Y1Bboo5KXL4", chorusStart: 58, releaseDate: "2023年7月19日" },
      { number: 15, title: "ラストノートしか知らない", videoId: "C8WMX7dEH7Y", chorusStart: 64, releaseDate: "2023年11月29日" },
      { number: 16, title: "呪って呪って", videoId: "cyRZGtNx_a4", chorusStart: 56, releaseDate: "2024年3月6日" },
      { number: 17, title: "絶対アイドル辞めないで", videoId: "17NBPoc78oM", chorusStart: 63, releaseDate: "2024年7月31日" },
      { number: 18, title: "とくべチュ、して", videoId: "F3P8vcZkIh4", chorusStart: 50, releaseDate: "2025年2月12日" },
      { number: 19, title: "ラブソングに襲われる", videoId: "_cf4UTe1qrY", chorusStart: 55, releaseDate: "2025年7月16日" },
      { number: 20, title: "劇薬中毒", videoId: "Bco8bY9r_H4", chorusStart: 60, releaseDate: "2026年2月18日" },
      { number: 21, title: "恋、はじめました。", videoId: "ikFaEAlO5N0", chorusStart: 58, releaseDate: "2026年8月26日" }
    ];

    let currentQuestions = [];
    let currentIdx = 0;
    let correctCount = 0;
    var player;
    let stopTimer;

    // YouTube IFrame Player APIを正しいURLで読み込む
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '2',
        width: '2',
        videoId: allSingles[0].videoId,
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, playsinline: 1 },
        events: { 'onReady': onPlayerReady }
      });
    }

    function onPlayerReady() {
      const startBtn = document.getElementById('start-btn');
      startBtn.disabled = false;
      startBtn.style.background = "#ff8fa3";
      startBtn.style.cursor = "pointer";
      startBtn.innerText = "ゲームを始める";
      document.getElementById('question-number').innerText = "=LOVE クイズ";
      document.getElementById('question-text').innerText = "全21枚の表題曲からランダムに5問出題します！";
    }

    function initGame() {
      document.getElementById('start-btn').style.display = "none";
      correctCount = 0;
      const shuffled = [...allSingles].sort(() => 0.5 - Math.random());
      currentQuestions = shuffled.slice(0, 5);
      currentIdx = 0;
      loadQuestion();
    }

    function loadQuestion() {
      clearTimeout(stopTimer);
      if (player && typeof player.pauseVideo === 'function') { player.pauseVideo(); }

      const currentQuiz = currentQuestions[currentIdx];
      if (player && typeof player.cueVideoById === 'function') {
        player.cueVideoById({ videoId: currentQuiz.videoId });
      }

      document.getElementById('question-number').innerText = `第 ${currentIdx + 1} 問 / 全5問`;
      document.getElementById('question-text').innerHTML = `<span style="color:var(--pink-dark); font-weight:bold;">${currentQuiz.number}th シングル</span> は何でしょう？`;

      document.getElementById('result').innerText = "";
      document.getElementById('next-btn').style.display = "none";

      let choiceTitles = [currentQuiz.title];
      while (choiceTitles.length < 4) {
        const randomSingle = allSingles[Math.floor(Math.random() * allSingles.length)];
        if (!choiceTitles.includes(randomSingle.title)) {
          choiceTitles.push(randomSingle.title);
        }
      }
      choiceTitles.sort(() => 0.5 - Math.random());

      const choicesDiv = document.getElementById('choices');
      choicesDiv.innerHTML = "";
      choiceTitles.forEach(title => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.innerText = `『 ${title} 』`;
        btn.onclick = () => checkAnswer(title);
        choicesDiv.appendChild(btn);
      });
    }

    function checkAnswer(selectedTitle) {
      const buttons = document.querySelectorAll('.choice-btn');
      buttons.forEach(b => b.disabled = true);

      const currentQuiz = currentQuestions[currentIdx];
      const resultDiv = document.getElementById('result');

      if (selectedTitle === currentQuiz.title) {
        resultDiv.innerHTML = `<span style='color: #2e9e3f; font-size: 24px;'>⭕ 正解！</span><br>`;
        correctCount++;
      } else {
        resultDiv.innerHTML = `<span style='color: #e0433a; font-size: 24px;'>❌ 不正解！</span><br>正解は <strong>『 ${currentQuiz.title} 』</strong> です！<br>`;
      }

      resultDiv.innerHTML += `📅 発売日：${currentQuiz.releaseDate}<br>🎵 サビを5秒間流すよ！`;
      resultDiv.innerHTML += `<br><button class="replay-btn" onclick="playChorus()">🔊 サビを聴く</button>`;

      // ボタンクリックの中で直接呼ぶことで、ブラウザの自動再生ブロックを回避する
      playChorus();

      document.getElementById('next-btn').style.display = "inline-block";
    }

    function playChorus() {
      const currentQuiz = currentQuestions[currentIdx];
      if (!player || typeof player.seekTo !== 'function') return;
      clearTimeout(stopTimer);
      player.seekTo(currentQuiz.chorusStart, true);
      player.unMute();
      player.playVideo();
      stopTimer = setTimeout(() => {
        if (player && typeof player.pauseVideo === 'function') { player.pauseVideo(); }
      }, 5000);
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < currentQuestions.length) {
        loadQuestion();
      } else {
        clearTimeout(stopTimer);
        if (player && typeof player.stopVideo === 'function') { player.stopVideo(); }
        let rankName = "";
        let rankComment = "";

        if (correctCount === 5) {
          rankName = "👑 伝説のイコラブマスター";
          rankComment = "全問正解！非の打ち所がない完璧なオタクです。指原Pもびっくり！";
        } else if (correctCount >= 3) {
          rankName = "💖 一人前のイコラブファン";
          rankComment = "素晴らしい知識量です！あと一歩でカンペキ！";
        } else if (correctCount >= 1) {
          rankName = "🌱 イコラブ見習い";
          rankComment = "ここからもっとMVを擦り切れるまで見ましょう！";
        } else {
          rankName = "😱 悔い改めよオタク";
          rankComment = "全問不正解…！後悔しましたか？今すぐもう一度挑戦です！";
        }

        document.getElementById('quiz-box').innerHTML = `
          <h2>🎉 クイズ終了！</h2>
          <p style="font-size: 20px;">あなたの結果は <strong>5問中 ${correctCount} 問正解</strong> でした！</p>
          <div class="rank-text">${rankName}</div>
          <p style="padding: 0 20px;">${rankComment}</p>
          <button class='btn' onclick='location.reload()'>もう一度遊ぶ</button>
        `;
      }
    }
  </script>
</body>
</html>
